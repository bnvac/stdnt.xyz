name: Add a scholarship
description: A scholarship, grant, or fellowship students can apply for
title: "[Scholarship] "
labels: ["contribution", "scholarship"]
body:
  - type: markdown
    attributes:
      value: |
        Adding a scholarship? Fill this in and submit — it becomes a tracked issue
        credited to your GitHub account.
  - type: input
    id: name
    attributes:
      label: Scholarship name
      placeholder: e.g. Coca-Cola Scholars Program
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official link
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: amount
    attributes:
      label: Award amount
      placeholder: e.g. $20,000 / Full ride / Up to $5,000
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Deadline
      placeholder: e.g. Oct 31, or "Rolling"
  - type: dropdown
    id: level
    attributes:
      label: Who can apply?
      options:
        - High school students
        - Undergraduates
        - Graduate students
        - Any / multiple
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Eligibility & notes
      placeholder: GPA minimum, citizenship, need-based, demographic focus, essay required, etc.
  - type: input
    id: tags
    attributes:
      label: Tags (optional, comma-separated)
      placeholder: stem, need-based, first-gen, no-essay
  - type: textarea
    id: image
    attributes:
      label: Logo or screenshot (optional)
      description: Drag an image in or paste from your clipboard — GitHub uploads it automatically. A logo or a screenshot of the page is a big help.
      placeholder: Drop a logo or screenshot here...
  - type: checkboxes
    id: checks
    attributes:
      label: Quick checks
      options:
        - label: This is a real, currently-open scholarship (not expired or defunct)
          required: true
        - label: The link is the official page, not an aggregator or referral link
          required: true
