name: Build site

# Regenerates everything that's built from the data files and commits it:
#   data/hackathons.json          live hackathons (Hack Club API, fetched server-side: it sends no CORS header)
#   logos/ + js/logos.js          cached favicons and brand icons for new listings
#   calendar/*.ics                the subscribable deadline feeds
#   guides/, scholarships/, ...   the crawlable pages, 404.html and sitemap.xml
# Runs when data or build scripts change on main, and daily so the
# date-relative output (deadlines page, feeds, hackathons) stays current.

on:
  push:
    branches: [main]
    paths:
      - "js/**"
      - "scripts/**"
      - "index.html"
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run build

      - name: Commit if changed
        run: |
          paths="data/hackathons.json logos js/logos.js calendar guides scholarships programs competitions tools discounts deadlines sitemap.xml 404.html"
          if [ -n "$(git status --porcelain $paths)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $paths
            git commit -m "Rebuild generated site files [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "No changes."
          fi
