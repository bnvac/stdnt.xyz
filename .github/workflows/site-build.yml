name: Rebuild pages, calendars and logos

# Keeps everything generated from the data files in sync:
#   - scripts/build-logos.mjs     caches new listings' logos into logos/
#   - scripts/build-calendar.mjs  writes the subscribable calendar/*.ics feeds
#   - scripts/build-pages.mjs     writes the crawlable guide/section pages + sitemap.xml
# Runs whenever the data or build scripts change, and daily so deadlines roll
# forward (the deadlines page and calendar feeds are date-relative).

on:
  push:
    paths:
      - "js/**"
      - "scripts/build-*.mjs"
      - "scripts/lib/**"
      - "index.html"
  schedule:
    - cron: "30 6 * * *"   # daily 06:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache logos
        run: node scripts/build-logos.mjs
      - name: Build calendar feeds
        run: node scripts/build-calendar.mjs
      - name: Build static pages and sitemap
        run: node scripts/build-pages.mjs

      - name: Commit if changed
        run: |
          paths="logos js/logos.js calendar guides scholarships programs competitions tools discounts deadlines sitemap.xml"
          if [ -n "$(git status --porcelain $paths)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $paths
            git commit -m "Rebuild pages, calendars and logos [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "No changes."
          fi
