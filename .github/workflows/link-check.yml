name: Link check

# Checks every external URL in the data files weekly (and on demand),
# and opens/updates a GitHub issue when any link is dead.

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check links
        id: check
        run: node scripts/check-links.mjs
        continue-on-error: true

      - name: Open or update issue on failure
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="🔗 Broken links found by link-check"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file link-report.md
          else
            gh issue create --title "$title" --body-file link-report.md
          fi

      - name: Fail the run if links are broken
        if: steps.check.outcome == 'failure'
        run: exit 1
