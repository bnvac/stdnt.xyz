name: Link check

# Checks every external URL in the data files weekly (and on demand). A link
# counts as dead after failing two runs in a row; dead links get a "Link may
# be down" note on the site (data/link-status.json) and are listed in one
# "Broken links" issue, which is updated while any are dead and closed once
# they're fixed. Broken third-party links don't fail the run.

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check links
        id: check
        run: node scripts/check-links.mjs

      - name: Commit link status if changed
        run: |
          if [ -n "$(git status --porcelain data/link-status.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/link-status.json
            git commit -m "Update link status [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "No link-status change."
          fi

      - name: Sync the broken-links issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEAD: ${{ steps.check.outputs.dead }}
        run: |
          title="Broken links found by link-check"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ "${DEAD:-0}" -gt 0 ]; then
            if [ -n "$existing" ]; then gh issue edit "$existing" --body-file link-report.md
            else gh issue create --title "$title" --body-file link-report.md; fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All links pass as of $(date -u +%F)."
          fi
