<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c0d10"/><stop offset="1" stop-color="#15131f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.8">
      <stop stop-color="#4f7cff" stop-opacity="0.22"/><stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="23.5" stroke="#23252e"/>

  <!-- mark -->
  <g transform="translate(600 96)" text-anchor="middle">
    <rect x="-34" y="-34" width="68" height="68" rx="16" fill="#ecedf1"/>
    <text x="0" y="12" font-size="34" font-weight="800" font-family="'JetBrains Mono',monospace" fill="#0c0d10" text-anchor="middle">.e</text>
  </g>

  <!-- title -->
  <text x="600" y="208" text-anchor="middle" font-size="74" font-weight="800" letter-spacing="-3" fill="#ecedf1">free stuff for students</text>
  <text x="600" y="250" text-anchor="middle" font-size="23" fill="#a0a4b2">Tools · free API keys · student perks · scholarships · STEM programs — all in one place</text>

  <!-- stat pills -->
  <g transform="translate(600 300)" text-anchor="middle" font-size="18" font-weight="600">
    <g transform="translate(-372 0)"><rect x="-78" y="-20" width="156" height="40" rx="20" fill="#131419" stroke="#2e3140"/><text fill="#4f7cff">77 tools</text></g>
    <g transform="translate(-150 0)"><rect x="-95" y="-20" width="190" height="40" rx="20" fill="#131419" stroke="#2e3140"/><text fill="#10b981">98 scholarships</text></g>
    <g transform="translate(96 0)"><rect x="-92" y="-20" width="184" height="40" rx="20" fill="#131419" stroke="#2e3140"/><text fill="#8b5cf6">214 programs</text></g>
    <g transform="translate(330 0)"><rect x="-86" y="-20" width="172" height="40" rx="20" fill="#131419" stroke="#2e3140"/><text fill="#f5a524">free LLM keys</text></g>
  </g>
</svg>
